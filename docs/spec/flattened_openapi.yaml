openapi: 3.0.0
info:
  title: BIN Lookup API
  description: Look up card information from a Bank Identification Number (BIN) and
    check account balance and expiry using the Bintable API.
  contact:
    email: hello@bintable.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0-oas3
servers:
- url: https://api.bintable.com/v1
security:
- ApiKeyAuth: []
tags:
- name: Lookup
  description: Authorized users with API Key can call this service
- name: Balance
  description: Authorized users with API Key can call endpoints under this tag.
paths:
  /{bin}:
    get:
      tags:
      - Lookup
      summary: Lookup for bin
      description: |
        By passing in the appropriate BIN, you can lookup for
        card meta data in bintable.com API
      operationId: binLookup
      parameters:
      - name: bin
        in: path
        description: pass the required BIN code
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: BIN data response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItem"
        "401":
          description: "Your balance is exhausted,or package expired"
        "403":
          description: Invalid API Key
        "422":
          description: API key is missing
  /balance:
    get:
      tags:
      - Balance
      summary: Check Balance
      description: Get Account balance and expiry
      operationId: balanceLookup
      responses:
        "200":
          description: Balance reponse
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItem"
        "401":
          description: "Your balance is exhausted,or package expired"
        "403":
          description: Invalid API Key
        "422":
          description: API key is missing
components:
  schemas:
    ResponseItem:
      required:
      - data
      - message
      - result
      type: object
      properties:
        result:
          type: integer
          description: The result status code of the request.
          example: 200
        message:
          type: string
          description: A short message describing the outcome of the request.
          example: SUCCESS
        data:
          type: object
          description: The payload returned for the request.
      description: "A response envelope carrying the result code, a message and the\
        \ returned data."
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: "The API key, which you can get from the bintable.com website."
      name: api_key
      in: query
